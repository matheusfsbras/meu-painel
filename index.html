<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #e0e0e0;
            background-color: #050505; 
            overflow: hidden; 
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; 
        }

        .login-box { 
            background: rgba(21, 21, 21, 0.9); 
            padding: 40px 30px; 
            border-radius: 8px; 
            text-align: center; 
            width: 320px; 
            border: 1px solid #2a2a2a;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px); 
        }

        #relogio {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: #ffffff;
            font-family: monospace;
        }

        #saudacao {
            font-size: 13px;
            color: #00ff88; 
            margin-bottom: 25px;
            min-height: 40px; 
            font-family: monospace;
            white-space: pre-wrap; 
            text-align: center; 
        }

        .input-container {
            position: relative;
            width: 100%;
            margin: 10px 0 20px 0;
        }

        input { 
            padding: 12px 40px 12px 12px; 
            border: 1px solid #333; 
            border-radius: 4px; 
            width: 100%; 
            background-color: #1e1e1e; 
            color: #ffffff;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        input::placeholder { color: #666; }
        input:focus { outline: none; border-color: #555; }
        
        .toggle-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 18px;
            user-select: none;
        }

        .toggle-senha:hover { color: #fff; }

        button { 
            padding: 12px 20px; 
            background-color: #2a2a2a; 
            color: #ffffff; 
            border: 1px solid #444; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        button:hover { 
            background-color: #00ff88; 
            color: #000;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        
        #erro { 
            color: #ff3333; 
            display: none; 
            margin-top: 15px; 
            font-size: 13px; 
            font-family: monospace;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="login-box">
        <div id="relogio">00:00:00</div>
        <div id="saudacao"></div>
        
        <div class="input-container">
            <input type="password" id="senha" placeholder="Chave de acesso" autofocus>
            <span class="toggle-senha" id="olho" onclick="alternarSenha()">👁️</span>
        </div>
        
        <button id="btnAcessar">Autenticar</button>
        <div id="erro">> ACESSO NEGADO: Credenciais inválidas.</div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth
