<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #e0e0e0;
            background-color: #050505; 
            overflow: hidden; 
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; 
        }

        .login-box { 
            background: rgba(21, 21, 21, 0.9); 
            padding: 40px 30px; 
            border-radius: 8px; 
            text-align: center; 
            width: 320px; 
            border: 1px solid #2a2a2a;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px); 
        }

        #relogio {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: #ffffff;
            font-family: monospace;
        }

        #saudacao {
            font-size: 13px;
            color: #00ff88; 
            margin-bottom: 25px;
            min-height: 40px; 
            font-family: monospace;
            white-space: pre-wrap; 
            text-align: center; 
        }

        .input-container {
            position: relative;
            width: 100%;
            margin: 10px 0 20px 0;
        }

        input { 
            padding: 12px 40px 12px 12px; 
            border: 1px solid #333; 
            border-radius: 4px; 
            width: 100%; 
            background-color: #1e1e1e; 
            color: #ffffff;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        input::placeholder { color: #666; }
        input:focus { outline: none; border-color: #555; }
        
        .toggle-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 18px;
            user-select: none;
        }

        .toggle-senha:hover { color: #fff; }

        button { 
            padding: 12px 20px; 
            background-color: #2a2a2a; 
            color: #ffffff; 
            border: 1px solid #444; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        button:hover { 
            background-color: #00ff88; 
            color: #000;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        
        #erro { 
            color: #ff3333; 
            display: none; 
            margin-top: 15px; 
            font-size: 13px; 
            font-family: monospace;
        }

        #sys-info {
            position: fixed;
            bottom: 25px;
            font-size: 11px;
            color: #ffffff; 
            font-family: monospace;
            letter-spacing: 1px;
            background: rgba(21, 21, 21, 0.9); 
            padding: 12px 20px; 
            border-radius: 6px;
            border: 1px solid #333; 
            backdrop-filter: blur(4px); 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            z-index: 10; 
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="login-box">
        <div id="relogio">00:00:00</div>
        <div id="saudacao"></div>
        
        <div class="input-container">
            <input type="password" id="senha" placeholder="Chave de acesso" autofocus>
            <span class="toggle-senha" id="olho" onclick="alternarSenha()">👁️</span>
        </div>
        
        <button id="btnAcessar">Autenticar</button>
        <div id="erro">> ACESSO NEGADO: Credenciais inválidas.</div>
    </div>

    <div id="sys-info">
        SYS_HOST // Machinist MR9A Pro | Xeon E5-2680 v4 | 16GB DDR4 | RX 580 8GB
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'.split('');
        const fontSize = 14;
        const colunas = canvas.width / fontSize; 
        
        const drops = [];
        for (let x = 0; x < colunas; x++) {
            drops[x] = 1;
        }

        function desenharMatrix() {
            // Aumentado de 0.05 para 0.1 para apagar o rastro mais rápido
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Alterado de '#00ff88' para uma versão com 40% de opacidade
            ctx.fillStyle = 'rgba(0, 255, 136, 0.4)'; 
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const texto = caracteres[Math.floor(Math.random() * caracteres.length)];
                ctx.fillText(texto, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(desenharMatrix, 33);
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        function atualizarRelogio() {
            var agora = new Date();
            var h = agora.getHours().toString().padStart(2, '0');
            var m = agora.getMinutes().toString().padStart(2, '0');
            var s = agora.getSeconds().toString().padStart(2, '0');
            document.getElementById('relogio').innerText = h + ':' + m + ':' + s;
        }

        var textoSaudacao = "";
        var i = 0;
        
        function definirSaudacao() {
            var horas = new Date().getHours();
            if (horas >= 5 && horas < 12) {
                textoSaudacao = "> Bom dia!\n> Aguardando autenticação_";
            } else if (horas >= 12 && horas < 18) {
                textoSaudacao = "> Boa tarde!\n> Aguardando autenticação_";
            } else {
                textoSaudacao = "> Boa noite!\n> Aguardando autenticação_";
            }
            digitarTexto();
        }

        function digitarTexto() {
            if (i < textoSaudacao.length) {
                document.getElementById("saudacao").textContent += textoSaudacao.charAt(i);
                i++;
                setTimeout(digitarTexto, 40); 
            }
        }

        function alternarSenha() {
            var campoSenha = document.getElementById("senha");
            var iconeOlho = document.getElementById("olho");
            
            if (campoSenha.type === "password") {
                campoSenha.type = "text";
                iconeOlho.style.color = "#00ff88"; 
            } else {
                campoSenha.type = "password";
                iconeOlho.style.color = "#888"; 
            }
        }

        function verificarSenha() {
            var senhaDigitada = document.getElementById('senha').value;
            if (senhaDigitada === '12345') { 
                window.location.href = 'https://i.ibb.co/GXw2ZC8/8fa40e6f-7ee2-4b0b-a1cb-a2fe927031f7.jpg';
            } else {
                document.getElementById('erro').style.display = 'block';
                document.getElementById('senha').value = ''; 
                document.getElementById('senha').focus();
            }
        }

        window.onload = function() {
            atualizarRelogio();
            setInterval(atualizarRelogio, 1000); 
            definirSaudacao(); 

            document.getElementById("btnAcessar").addEventListener("click", verificarSenha);
            document.getElementById("senha").addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    verificarSenha();
                }
            });
        };
    </script>
</body>
</html>
